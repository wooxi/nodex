<%
-- NodeX 管理界面（服务端模板 + 独立 JS 应用）
local uci = require "luci.model.uci".cursor()
-%>
<%+header%>
<div id="nodex-app" style="padding: 0 8px;">
    <div style="background:#fff;border:1px solid #ddd;border-radius:4px;padding:16px;margin-bottom:12px;">
        <h2 style="margin:0 0 4px 0;">NodeX 节点管家</h2>
        <div style="color:#999;font-size:12px;">Xray + Hysteria2 节点管理 · Xboard 面板对接</div>
    </div>
    <div style="background:#fff;border:1px solid #ddd;border-radius:4px;padding:12px;">
        <div id="nodex-menu" style="margin-bottom:12px;border-bottom:1px solid #eee;padding-bottom:8px;">
            <a href="#overview" class="nodex-menu-item" data-page="overview">总览</a>
            <a href="#nodes" class="nodex-menu-item" data-page="nodes">节点管理</a>
            <a href="#panel" class="nodex-menu-item" data-page="panel">面板对接</a>
            <a href="#system" class="nodex-menu-item" data-page="system">系统设置</a>
            <a href="#logs" class="nodex-menu-item" data-page="logs">运行日志</a>
        </div>
        <div id="nodex-content">
            <div style="color:#999;">加载中...</div>
        </div>
    </div>
</div>
<script src="/luci-static/resources/nodex/app.js"></script>
<style>
.nodex-menu-item { display:inline-block; padding:6px 14px; margin-right:4px; text-decoration:none; color:#333; border-radius:3px; }
.nodex-menu-item:hover { background:#f0f0f0; }
.nodex-menu-item.active { background:#1e88e5; color:#fff; }
.nodex-card { border:1px solid #eee; border-radius:4px; padding:14px; margin-bottom:12px; }
.nodex-card h3 { margin:0 0 10px 0; font-size:15px; }
.nodex-table { width:100%; border-collapse:collapse; font-size:13px; }
.nodex-table th { background:#f7f7f7; text-align:left; padding:8px; border:1px solid #eee; }
.nodex-table td { padding:8px; border:1px solid #eee; }
.nodex-btn { display:inline-block; padding:5px 12px; margin-right:6px; border:1px solid #ccc; border-radius:3px;
  background:#f9f9f9; cursor:pointer; font-size:13px; text-decoration:none; color:#333; }
.nodex-btn:hover { background:#eee; }
.nodex-btn-primary { background:#1e88e5; color:#fff; border-color:#1e88e5; }
.nodex-btn-danger { background:#e53935; color:#fff; border-color:#e53935; }
.nodex-field { margin-bottom:10px; }
.nodex-field label { display:inline-block; width:160px; font-size:13px; color:#555; }
.nodex-field input, .nodex-field select { padding:5px 8px; border:1px solid #ccc; border-radius:3px; font-size:13px; }
.nodex-field input[type=text] { width:340px; }
.nodex-field input[type=number] { width:120px; }
.nodex-tag { display:inline-block; padding:2px 8px; border-radius:3px; font-size:12px; }
.nodex-tag-ok { background:#e8f5e9; color:#2e7d32; }
.nodex-tag-err { background:#fdecea; color:#c62828; }
.nodex-tag-off { background:#f5f5f5; color:#999; }
.nodex-pre { background:#1e242b; color:#b8c4ce; padding:14px; border-radius:6px; font-size:12px;
  max-height:60vh; overflow:auto; white-space:pre-wrap; word-break:break-all; font-family:Consolas,'JetBrains Mono',monospace;
  line-height:1.7; border:1px solid #2c353d; }
.nodex-pre .lg-time { color:#7a8a99; }
.nodex-pre .lg-info { color:#b8c4ce; }
.nodex-pre .lg-warn { color:#e6a23c; }
.nodex-pre .lg-err { color:#f56c6c; font-weight:600; }
/* 统计卡片网格 */
.nx-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
.nx-stat { background:#fff; border:1px solid #e5e9ef; border-radius:8px; padding:16px; text-align:center; }
.nx-stat .num { font-size:26px; font-weight:700; color:#1e88e5; }
.nx-stat .num.ok { color:#2e7d32; }
.nx-stat .lbl { font-size:12px; color:#888; margin-top:4px; }
/* 卡片标题 */
.nodex-card h3 { font-size:14px; border-bottom:1px solid #f0f2f5; padding-bottom:8px; margin-bottom:10px; }
/* 内核开关行 */
.nx-kernel-row { display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid #f5f6f8; flex-wrap:wrap; }
.nx-kernel-row:last-child { border-bottom:none; }
.nx-kernel-name { width:110px; font-weight:600; }
.nx-kernel-dots { display:flex; gap:4px; }
.nx-dot { width:8px; height:8px; border-radius:50%; background:#e0e0e0; display:inline-block; }
.nx-dot.on { background:#2e7d32; }
.nx-dot.off { background:#e53935; }
/* 日志工具栏 */
.nx-logbar { display:flex; align-items:center; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.nx-logbar .info { margin-left:auto; font-size:12px; color:#999; }
/* 功能入口卡片 */
.nx-funcs { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:14px; }
.nx-func { background:#fff; border:1px solid #e5e9ef; border-radius:8px; padding:14px; cursor:pointer;
  transition:all .15s; display:block; text-decoration:none; color:#333; }
.nx-func:hover { border-color:#1e88e5; box-shadow:0 2px 8px rgba(30,136,229,.12); transform:translateY(-1px); }
.nx-func .ic { font-size:20px; margin-bottom:6px; }
.nx-func .t { font-weight:600; font-size:13px; }
.nx-func .d { font-size:11px; color:#999; margin-top:2px; }
/* 表格响应式 */
.nx-table-wrap { overflow-x:auto; -webkit-overflow-scrolling:touch; }
.nx-table-wrap table { min-width:520px; }
/* 菜单响应式 */
#nodex-menu { display:flex; overflow-x:auto; -webkit-overflow-scrolling:touch; }
#nodex-menu .nodex-menu-item { flex-shrink:0; }
/* 移动端适配 */
@media (max-width:900px){
  .nx-funcs { grid-template-columns:repeat(2,1fr); }
  .nx-stats { grid-template-columns:repeat(2,1fr); }
}
@media (max-width:600px){
  .nx-stats { grid-template-columns:repeat(2,1fr); gap:8px; }
  .nx-stat { padding:10px; }
  .nx-stat .num { font-size:20px; }
  .nodex-field label { width:110px; }
  .nodex-field input[type=text], .nodex-field textarea { width:100% !important; box-sizing:border-box; }
  .nodex-card { padding:10px; }
  .nx-kernel-name { width:90px; }
}
.nodex-err { color:#c62828; font-size:13px; margin:8px 0; }
.nodex-ok { color:#2e7d32; font-size:13px; margin:8px 0; }
.nodex-proto { display:inline-block; padding:8px 14px; margin:0 6px 6px 0; border:1px solid #ccc; border-radius:4px; cursor:pointer; font-size:13px; }
.nodex-proto.active { border-color:#1e88e5; background:#e3f2fd; color:#1e88e5; }
</style>
<%+footer%>
