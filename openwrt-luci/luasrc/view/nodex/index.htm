<%
-- NodeX 管理界面（LuCI 原生风格）
-%>
<%+header%>
<div id="nodex-app" class="cbi-map">
    <h2>NodeX 节点管家 <small style="color:#999;font-weight:normal;font-size:12px">Xray + Hysteria2 · Xboard 面板对接</small></h2>

    <div class="cbi-section" style="margin-top:12px">
        <div class="cbi-section-node">
            <!-- 导航（LuCI 标签页风格） -->
            <div class="cbi-tab-container">
                <ul class="cbi-tabmenu" id="nodex-menu">
                    <li data-page="overview"><a href="javascript:void(0)" onclick="window.nodexGo('overview')">总览</a></li>
                    <li data-page="nodes"><a href="javascript:void(0)" onclick="window.nodexGo('nodes')">节点管理</a></li>
                    <li data-page="panel"><a href="javascript:void(0)" onclick="window.nodexGo('panel')">面板对接</a></li>
                    <li data-page="system"><a href="javascript:void(0)" onclick="window.nodexGo('system')">系统设置</a></li>
                    <li data-page="logs"><a href="javascript:void(0)" onclick="window.nodexGo('logs')">运行日志</a></li>
                </ul>
            </div>

            <div id="nodex-content" style="padding-top:16px">
                <div style="color:#999;text-align:center;padding:30px 0">加载中...</div>
            </div>
        </div>
    </div>
</div>

<script src="/luci-static/resources/nodex/app.js"></script>
<style>
/* 少量补充样式（LuCI cbi 为主，仅布局辅助） */
#nodex-app .nx-stats { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
#nodex-app .nx-stat { border:1px solid #e2e7ee; border-radius:6px; padding:12px 14px; background:#fff; }
html.dark #nodex-app .nx-stat { background:#14181e; border-color:#2d3744; }
#nodex-app .nx-stat .num { font-size:22px; font-weight:700; }
#nodex-app .nx-stat .num.ok { color:#159b4d; }
#nodex-app .nx-stat .lbl { font-size:11px; color:#888; margin-top:2px; }
#nodex-app .nx-krow { display:flex; align-items:center; gap:12px; padding:7px 0; flex-wrap:wrap; border-bottom:1px solid #f0f2f5; }
#nodex-app .nx-krow:last-child { border-bottom:none; }
#nodex-app .nx-kname { font-weight:700; width:100px; }
#nodex-app .nx-kdots { display:flex; gap:4px; }
#nodex-app .nx-dot { width:8px; height:8px; border-radius:50%; background:#ccc; display:inline-block; }
#nodex-app .nx-dot.on { background:#159b4d; }
#nodex-app .nx-dot.off { background:#d23333; }
#nodex-app .nx-proto { display:flex; gap:6px; flex-wrap:wrap; }
#nodex-app .nx-proto-item { padding:6px 14px; border:1px solid #ccc; border-radius:4px; cursor:pointer; font-size:13px; }
#nodex-app .nx-proto-item.active { background:#1e88e5; color:#fff; border-color:#1e88e5; }
#nodex-app .nx-pre { background:#10161d; color:#c3cfdb; padding:12px; border-radius:6px; font-size:12px;
  max-height:60vh; overflow:auto; white-space:pre-wrap; word-break:break-all; font-family:monospace; line-height:1.7; }
#nodex-app .nx-pre .lg-time { color:#64788f; }
#nodex-app .nx-pre .lg-warn { color:#e2a344; }
#nodex-app .nx-pre .lg-err { color:#f07171; font-weight:700; }
#nodex-app .nx-logbar { display:flex; align-items:center; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
#nodex-app .nx-logbar .info { margin-left:auto; font-size:12px; color:#999; }
#nodex-app .nx-msg { padding:8px 12px; border-radius:4px; font-size:13px; margin:8px 0; }
#nodex-app .nx-msg.ok { background:#e8f5e9; color:#2e7d32; }
html.dark #nodex-app .nx-msg.ok { background:#1b3a22; }
#nodex-app .nx-msg.err { background:#fdecea; color:#c62828; }
html.dark #nodex-app .nx-msg.err { background:#3d1f1f; }
#nodex-app .nx-empty { color:#999; text-align:center; padding:20px 0; font-size:13px; }
#nodex-app .nx-table-wrap { overflow-x:auto; }
/* 仪表盘大框（整合统计 + 面板同步） */
#nodex-app .nx-dash { display:flex; align-items:center; gap:0; flex-wrap:wrap; }
#nodex-app .nx-dash-item { flex:1 1 0; text-align:center; padding:6px 10px; min-width:90px; }
#nodex-app .nx-dash-item .num { font-size:24px; font-weight:700; }
#nodex-app .nx-dash-item .num.ok { color:#159b4d; }
#nodex-app .nx-dash-item .lbl { font-size:11px; color:#888; margin-top:2px; }
#nodex-app .nx-dash-sep { width:1px; align-self:stretch; background:#e2e7ee; margin:4px 0; }
html.dark #nodex-app .nx-dash-sep { background:#2d3744; }
#nodex-app .nx-dash-sync { padding:6px 14px; text-align:right; font-size:12px; color:#888; white-space:nowrap; }
@media (max-width:700px) {
    #nodex-app .nx-dash-item { min-width:70px; padding:4px 6px; }
    #nodex-app .nx-dash-item .num { font-size:18px; }
    #nodex-app .nx-dash-sync { width:100%; text-align:center; border-top:1px solid #eee; margin-top:6px; padding:8px 0 2px; }
}
/* 电脑端双列布局（紧凑） */
#nodex-app .nx-grid { display:grid; grid-template-columns:1fr; gap:0 14px; align-items:start; }
@media (min-width:1200px) {
    #nodex-app .nx-grid { grid-template-columns:1fr 1fr; }
}
#nodex-app .nx-span2 { grid-column:1/-1; }
@media (max-width:700px) {
    #nodex-app .nx-stats { grid-template-columns:repeat(2,1fr); }
    #nodex-app .cbi-value-title { width:110px; }
}
</style>
<%+footer%>
