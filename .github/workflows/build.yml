name: Build & release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        working-directory: webui
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build & vet
        run: |
          go vet ./...
          VERSION=$(git describe --tags --always 2>/dev/null || echo dev)
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X main.version=$VERSION" -o nodex-linux-amd64 ./cmd/nodex

      - name: Upload binary
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: nodex-linux-amd64
          generate_release_notes: false
          token: ${{ secrets.GITHUB_TOKEN }}
